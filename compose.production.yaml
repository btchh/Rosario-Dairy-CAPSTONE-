# Standalone production definition: do not merge with the local compose.yaml.
name: rosario-dairy-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-container: &container
  image: ${BACKEND_IMAGE:-rosario-dairy-backend:production}
  build:
    context: .
  init: true
  read_only: true
  tmpfs: [/tmp]
  logging: *logging

x-runtime: &runtime
  <<: *container
  environment: &runtime-environment
    DJANGO_ENV: production
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique production secret}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set the production domain}
    DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Manila}
    DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:?Set an allowed production health-check host}
    DJANGO_BEHIND_HTTPS_PROXY: "true"
    # The trusted edge supplies one canonical client IP, preserved by inner hops.
    DJANGO_NUM_PROXIES: "1"
    DJANGO_SECURE_SSL_REDIRECT: "true"
    DJANGO_SESSION_COOKIE_SECURE: "true"
    DJANGO_CSRF_COOKIE_SECURE: "true"
    DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
    DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
    DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
    DB_NAME: ${DB_NAME:?Set the production database name}
    DB_USER: ${DB_USER:?Set the restricted application database user}
    DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
    DB_HOST: db
    DB_PORT: "5432"
    DB_CONNECT_TIMEOUT: "5"
    REDIS_URL: redis://redis:6379/0
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the production HTTPS origin}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the production HTTPS origin}
    SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:?Set the SMTP account}
    SMTP_PASSWORD: ${SMTP_PASSWORD:?Set the SMTP password or app password}
    SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set the sender address}
    API_DATA_CACHE_TIMEOUT: ${API_DATA_CACHE_TIMEOUT:-300}
    HISTORY_CACHE_TIMEOUT: ${HISTORY_CACHE_TIMEOUT:-3600}
  volumes:
    - backend_backups:/app/backups
    - staticfiles:/app/staticfiles

services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:?Set the production database name}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set the bootstrap administrator}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set the bootstrap administrator password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  provision:
    <<: *container
    command: ["python", "docker/provision_database.py"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:?Set the production database name}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Set the bootstrap administrator}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set the bootstrap administrator password}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?Set the schema-owner migration user}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set the migration password}
      DB_USER: ${DB_USER:?Set the restricted application database user}
      DB_PASSWORD: ${DB_PASSWORD:?Set the application database password}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *runtime
    environment:
      <<: *runtime-environment
      DB_USER: ${MIGRATION_DB_USER:?Set the schema-owner migration user}
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set the migration password}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  preflight:
    <<: *runtime
    command: ["python", "docker/production_preflight.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *runtime
    depends_on:
      preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 30s
      timeout: 20s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s

  events:
    <<: *runtime
    command: ["uvicorn", "config.asgi:application", "--host=0.0.0.0", "--port=8001", "--no-proxy-headers", "--lifespan=off", "--timeout-graceful-shutdown=10"]
    depends_on:
      preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "docker/events_healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 15s

  forecast-worker:
    <<: *runtime
    command: ["python", "manage.py", "watch_forecast_models"]
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s

  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    volumes:
      - ./docker/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
    depends_on:
      api:
        condition: service_healthy
      events:
        condition: service_healthy
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    restart: unless-stopped
    logging: *logging

  frontend:
    profiles: [frontend]
    image: ${FRONTEND_IMAGE:-rosario-dairy-frontend:local}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    volumes:
      - ./docker/frontend.production.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  backend_backups:
  staticfiles:
