# Internal only: expose through the TLS edge, never directly on a public port.
map $http_x_forwarded_for $rosario_client_ip {
    "" $remote_addr;
    default $http_x_forwarded_for;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    location = /backend/events/ {
        proxy_pass http://gateway:8080/events/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $rosario_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
    }
    location /backend/ {
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $rosario_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
