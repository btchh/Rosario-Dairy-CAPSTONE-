# Temporary HTTP-only edge for the first certificate request.
# Replace app.example.com with the hostname registered to your account.
# After issuance, replace this site with edge.nginx.example.conf.
server {
    listen 80;
    server_name app.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
