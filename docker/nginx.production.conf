# Internal only. The public TLS edge overwrites X-Forwarded-For with one client IP.
map $http_x_forwarded_for $rosario_client_ip {
    "" $remote_addr;
    default $http_x_forwarded_for;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 3m;
    location /static/ {
        alias /srv/static/;
        expires 1h;
    }
    location = /events/ {
        proxy_pass http://events:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $rosario_client_ip;
        proxy_set_header X-Forwarded-For $rosario_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $rosario_client_ip;
        proxy_set_header X-Forwarded-For $rosario_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
