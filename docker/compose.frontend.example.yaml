# Merge with the backend compose.yaml; all paths resolve from that base file.
# The frontend image must serve its built Vite assets from /usr/share/nginx/html.
services:
  frontend:
    image: ${FRONTEND_IMAGE:-rosario-dairy-frontend:local}
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - ./docker/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
